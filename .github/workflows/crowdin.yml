# Workflow that syncronizes translations from Crowdin
name: Crowdin

on:
  # Check for updates every day
  schedule:
    # Everyday at 01:12
    - cron: '12 1 * * *'

  # Sync when a commit is done on the reference branches
  push:
    branches: ["lts-2021"]
    paths:
      - 'nuxeo-coldstorage-web/i18n/messages.json'

jobs:
  # in uses, cannot use environment variable for {owner}/{repo} nor matrix strategy variable for {ref}
  # thus hardcoding them
  call-workflow-in-lts-2023:
    if: github.event_name == 'schedule'
    uses: nuxeo/nuxeo-coldstorage/.github/workflows/crowdin.yml@lts-2023
    secrets: inherit
    needs: crowdin

  call-workflow-in-lts-2025:
    if: github.event_name == 'schedule'
    uses: nuxeo/nuxeo-coldstorage/.github/workflows/crowdin.yml@lts-2025
    secrets: inherit
    needs: call-workflow-in-lts-2023

  crowdin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: lts-2021

      - name: Crowdin Action
        id: crowdin-sync
        uses: crowdin/github-action@1.5.2
        with:
          # Disable 'git checkout "${GITHUB_REF#refs/heads/}"'
          skip_ref_checkout: true

          # Tokens
          project_id: ${{ secrets.CROWDIN_PROJECT_ID }}
          token: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

          # Load external configuration file (to support translation rename)
          config: crowdin-conf.yml

          # Upload sources for translation
          upload_sources: true

          # Auto-approve reference sentences we are pushing (english)
          auto_approve_imported: true

          # Name of the branch where to merge the translations
          localization_branch_name: crowdin-translations-update-lts-2021
          pull_request_base_branch_name: lts-2021
          create_pull_request: true
          pull_request_reviewers: 'manonlumeau'
          pull_request_title: New Crowdin translations by GitHub Action (lts-2021)

          # Automatically download all the new translations
          download_translations: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for the PR
        if: steps.crowdin-sync.outputs.pull_request_url
        run: gh pr --repo $GITHUB_REPOSITORY merge ${{ steps.crowdin-sync.outputs.pull_request_url }} --auto --rebase
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
