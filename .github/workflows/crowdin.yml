# Workflow that syncronizes translations from Crowdin
name: Crowdin

on:
  # Check for updates every day
  schedule:
    # Everyday at 01:12
    - cron: '12 1 * * *'

  # Sync when a commit is done on the reference branches
  push:
    branches: ["lts-2021"]
    paths:
      - 'nuxeo-coldstorage-web/i18n/messages.json'

  pull_request:
    branches: [ "lts-2021" ]

jobs:
  crowdin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Test
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: |
          import os
          for q in (os.getenv("CROWDIN_PROJECT_ID")):
            print(q)
          print('####')
          for q in (os.getenv("CROWDIN_PERSONAL_TOKEN")):
            print(q)
        shell: python
