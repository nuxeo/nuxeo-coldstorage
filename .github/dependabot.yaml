version: 2
updates:
  # Default branch: lts-2023
  # Maven
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    # Limit version updates to 10 to prevent CI overload
    open-pull-requests-limit: 10
    # Group all version updates (patch only)
    groups:
      version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
    ignore:
      # Major and minor version updates
      - dependency-name: "*"
        update-types: [
          "version-update:semver-major",
          "version-update:semver-minor"
        ]

      # Nuxeo dependencies Dependabot would try to fetch unnecessarily
      - dependency-name: "org.nuxeo.*"

      # Nuxeo parent POM
      - dependency-name: "org.nuxeo:nuxeo-parent"
        update-types: ["version-update:semver-patch"]

  # npm
  - package-ecosystem: "npm"
    directory: "/nuxeo-coldstorage-web"
    schedule:
      interval: "daily"
    # Limit version updates to 10 to prevent CI overload
    open-pull-requests-limit: 10
    # Group version updates (patch only)
    groups:
      nuxeo-version-updates:
        applies-to: "version-updates"
        patterns:
          - "@nuxeo/*"
      version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
    ignore:
      # Major and minor version updates
      - dependency-name: "*"
        update-types: [
          "version-update:semver-major",
          "version-update:semver-minor"
        ]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    # Group all version updates (major, minor and patch)
    groups:
      version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"

  # Branch lts-2025
  # Maven
  - package-ecosystem: "maven"
    target-branch: "lts-2025"
    directory: "/"
    schedule:
        interval: "daily"
    # Limit version updates to 10 to prevent CI overload
    open-pull-requests-limit: 10
    # Group all version updates (minor and patch)
    groups:
      version-updates:
        patterns:
          - "*"
    ignore:
      # Major version updates
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

      # Nuxeo dependencies Dependabot would try to fetch unnecessarily
      - dependency-name: "org.nuxeo.*"

      # Nuxeo parent POM
      - dependency-name: "org.nuxeo:nuxeo-parent"
        update-types: [
          "version-update:semver-minor",
          "version-update:semver-patch"
        ]

  # npm
  - package-ecosystem: "npm"
    target-branch: "lts-2025"
    directory: "/nuxeo-coldstorage-web"
    schedule:
      interval: "daily"
    # Limit version updates to 10 to prevent CI overload
    open-pull-requests-limit: 10
    # Group version updates (minor and patch)
    groups:
      nuxeo-version-updates:
        patterns:
          - "@nuxeo/*"
      version-updates:
        patterns:
          - "*"
    ignore:
      # Major version updates
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    target-branch: "lts-2025"
    directory: "/"
    schedule:
      interval: "daily"
    # Group all version updates (major, minor and patch)
    groups:
      version-updates:
        patterns:
          - "*"
